<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Kestrel has moved</title>
    <meta name="theme-color" content="#17375E" />
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%kestrel.svg" />
    <!-- The new address, for anyone whose script does not run. -->
    <noscript><meta http-equiv="refresh" content="8; url=https://kestrel.allmymind.org/" /></noscript>
    <style>
      html, body { margin: 0; min-height: 100%; background: #17375e; color: #fff; font-family: 'Trebuchet MS', 'Segoe UI', system-ui, sans-serif; }
      body { padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
      .moved { box-sizing: border-box; max-width: 32rem; margin: 0 auto; padding: 2rem 1.25rem; display: flex; flex-direction: column; gap: 1rem; }
      .moved-title { margin: 0; font-size: 2rem; }
      .moved-lead { margin: 0; font-size: 1.25rem; }
      .moved-text { margin: 0; line-height: 1.5; }
      .moved-saves { display: flex; flex-direction: column; gap: 0.75rem; }
      .moved-status { margin: 0; min-height: 1.5em; color: #fbe3ae; }
      .moved-button { display: block; box-sizing: border-box; min-height: 3rem; padding: 0.75rem 1rem; border: 0; border-radius: 0.75rem; font: inherit; font-size: 1.1rem; font-weight: 700; text-align: center; text-decoration: none; touch-action: manipulation; }
      .moved-save { background: #fbe3ae; color: #17375e; }
      .moved-open { background: #f2b632; color: #17375e; }
    </style>
  </head>
  <body>
    <noscript><p style="padding:1.25rem"><a style="color:#fbe3ae" href="https://kestrel.allmymind.org/">Kestrel has moved to kestrel.allmymind.org</a></p></noscript>
    <div id="root"></div>
    <script type="module" src="../src/moved/main.ts"></script>
  </body>
</html>
