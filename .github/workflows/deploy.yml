name: Deploy the moved page to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:unit
      # The app is served at https://kestrel.allmymind.org/ now (docs/hosting.md). This address, /spell-forge/, shows a page that says Kestrel
      # moved, with one tap to save a child's data (IndexedDB does not follow a new origin) and the new link.
      - run: npm run build:moved
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-moved

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
